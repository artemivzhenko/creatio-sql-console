<div class="console-wrapper">
  <ia-sql-editor
    (queryReady)="onQueryReady($event)"
    (queryChanged)="onQueryChanged($event)"
    (execute)="onExecute($event)"
    (save)="onSave($event)"
  ></ia-sql-editor>

  <ia-sql-results
    [rawData]="rawData()"
    [displayedColumns]="displayedColumns()"
    [isLoading]="isLoading()"
    [elapsedMs]="elapsedMs()"
    [executionMs]="executionMs()"
    [errorText]="errorText()"
    [rowsAffected]="rowsAffected()"
    [truncated]="truncated()"
    [emptyResult]="emptyResult()"  ></ia-sql-results>
</div>
